name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Forelight needs Swift 6.2 (Xcode 26). Bump this runner or select a newer
    # Xcode if the build fails on the default toolchain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: a stable code-signing certificate keeps the Accessibility grant
      # across updates. Without the secret the build falls back to an ad-hoc
      # signature and users re-grant permission after each update.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No signing certificate provided; the build will be signed ad-hoc."
            exit 0
          fi
          echo "$P12" | base64 --decode > signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import signing.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm signing.p12

      - name: Build DMG and zip
        env:
          FORELIGHT_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            Download the DMG, drag Forelight to Applications, then allow the
            first launch (the build is not notarized):

            - macOS 15+: double-click, dismiss the warning, then open
              System Settings → Privacy & Security, scroll down, and click
              "Open Anyway".
            - macOS 14 and earlier: right-click the app, choose Open, then Open.
            - Or run: xattr -dr com.apple.quarantine /Applications/Forelight.app

            Grant Accessibility permission when Forelight asks. Updates install
            in place and keep that grant, because every release is signed with
            the same certificate.
